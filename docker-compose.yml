services:
  monere:
    build: .
    container_name: monere_app
    network_mode: "host"
    environment:
      - SNIFFER_IFACE=[INTERFACE]           # MODIFY THIS
      - TZ=[TIMEZONE]                       # MODIFY THIS
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

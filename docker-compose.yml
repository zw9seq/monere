services:
  monere:
    build: .
    container_name: monere_app
    network_mode: "host"
    enviroment:
      - SNIFFER_IFACE=wlan0           # MODIFY THIS
    volumes:
      - ./data:/app/data
      - ./oui.json:/app/data/oui.json
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
